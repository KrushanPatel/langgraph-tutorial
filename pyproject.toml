[project]
name = "langgraph-tutorial"
version = "0.1.0"
description = "Production-style reference implementations of the LangGraph 1.x public API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pycryptodome>=3.23.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lg_prod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Module docstrings in these files contain wide markdown tables.
"src/lg_prod/{state,legacy,persistence}.py" = ["E501"]
"src/lg_prod/graphs/alert_pipeline.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# `@task(retry_policy=...)` returns an overloaded decorator whose ParamSpec
# mypy cannot infer, so every task call is typed as taking `Never`.
module = "lg_prod.graphs.postmortem"
disable_error_code = ["arg-type", "var-annotated"]
